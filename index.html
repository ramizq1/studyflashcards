<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Decks</title>
  <meta name="description" content="Flashcard quizzes by course and learning objective.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236250f5'/%3E%3Cstop offset='1' stop-color='%230ab4e0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>try{var t=localStorage.getItem('fc:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg></span>
        Study Decks
      </a>
      <div class="top-actions">
        <button class="btn" id="loadDeckBtn" type="button" title="Preview a deck JSON file without rebuilding">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          <span class="hide-sm">Open deck file</span>
        </button>
        <button class="btn icon" id="themeBtn" type="button" aria-label="Toggle light or dark theme"></button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="foot">Decks live in <code>notes/</code> · courses in <code>courses/courses.json</code> · run <code>update-decks.bat</code> after adding files</footer>

  <input type="file" id="deckFile" accept=".json,application/json" hidden>
  <script src="data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
